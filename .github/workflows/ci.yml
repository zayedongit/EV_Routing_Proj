name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest -m "not slow" --cov=evrp --cov-report=term-missing
      - name: Smoke-test the CLI
        run: |
          python -m evrp.cli validate --instance data/C101.csv --battery 40
          python -m evrp.cli solve --instance data/C101.csv --solver savings \
            --time-limit 5 --out /tmp/evrp-ci --no-plots
